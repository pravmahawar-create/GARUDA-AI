[build]
builder = "nixpacks"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

[env]
NODE_ENV = "production"
PORT = "3000"
GARUDA_BOUNTY_DAEMON = "true"
GARUDA_BOUNTY_INTERVAL = "30"
GARUDA_EMAIL_HOST = "smtp.zoho.in"
GARUDA_EMAIL_PORT = "465"
