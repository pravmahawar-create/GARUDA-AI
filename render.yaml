services:
  - type: web
    name: garuda-ai
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GARUDA_BOUNTY_DAEMON
        value: false
      - key: GARUDA_EMAIL_HOST
        value: smtp.zoho.in
      - key: GARUDA_EMAIL_PORT
        value: 465
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_FOUNDER_CHAT_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: RAZORPAY_KEY_ID_LIVE
        sync: false
      - key: LEMONSQUEEZY_STORE_URL
        value: https://garudaos.lemonsqueezy.com
      - key: GUMROAD_ENABLED
        value: true
      - key: WHATSAPP_CLOUD_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      # Browser fallback for WhatsApp (no Cloud token needed) — headless on Render
      - key: WHATSAPP_HEADLESS
        value: true
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: false
      - key: GARUDA_AGENCY_DAEMON
        value: true
      - key: GARUDA_AGENCY_INTERVAL_MS
        value: 86400000
      - key: GARUDA_OVERNIGHT_HUNTERS
        value: true
      - key: GARUDA_AUTONOMOUS_ACTIVE
        value: true
      - key: REVENUE_OPERATING_CYCLE_DRYRUN
        value: false
      - key: GARUDA_RADAR_MONITOR
        value: true
      - key: INSTAGRAM_SESSION_ID
        sync: false
      - key: INSTAGRAM_USER_ID
        sync: false
