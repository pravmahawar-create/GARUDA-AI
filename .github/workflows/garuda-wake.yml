name: GARUDA Wake Keeper

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render backend (keeps free dyno awake 24x7)
        run: |
          curl -fsS --retry 4 --retry-delay 15 --retry-all-errors --max-time 60 -o /dev/null \
            -w "render /api/health -> %{http_code} (%{time_total}s)\n" \
            https://garuda-ai-xfif.onrender.com/api/health || exit 1

      - name: Verify public frontend responds
        run: |
          curl -fsS --max-time 30 -o /dev/null -w "garudaos.in -> %{http_code} (%{time_total}s)\n" \
            https://www.garudaos.in || true

      - name: Wake ABSLI knowledge + revenue checkpoints
        run: |
          curl -fsS --max-time 30 -o /dev/null -w "telegram knowledge -> %{http_code}\n" \
            https://garuda-ai-xfif.onrender.com/api/telegram/knowledge || true
          curl -fsS --max-time 30 -o /dev/null -w "revenue metrics -> %{http_code}\n" \
            https://garuda-ai-xfif.onrender.com/api/revenue/metrics || true
