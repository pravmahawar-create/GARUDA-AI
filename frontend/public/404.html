<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 - Page Not Found | GARUDA OS</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #030712;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #f59e0b;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.25rem 0.75rem;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 9999px;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 3.5rem;
      font-weight: 900;
      color: #f59e0b;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 1rem;
    }
    p {
      color: #9ca3af;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f59e0b;
      color: #030712;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.75rem 1.75rem;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.16s ease, transform 0.16s ease;
    }
    a.btn:hover {
      background: #d97706;
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">HTTP 404 &bull; Resource Missing</div>
    <h1>404</h1>
    <h2>Route Not Located</h2>
    <p>The sovereign route you requested does not exist or has been relocated to another execution universe.</p>
    <a href="/" class="btn">Return to Headquarters &rarr;</a>
  </div>
</body>
</html>
